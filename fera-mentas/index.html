<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fera.mentas</title>
<meta name="description" content="Ferramentas que rodam no navegador, cada uma com seu bicho.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23A3D841'/%3E%3Cstop offset='1' stop-color='%231FBCCF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="hub.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="page">
  <header class="bar"><span class="mark">Fera.mentas</span></header>
  <main>
    <section class="intro">
      <h1>Cada ferramenta tem seu bicho.</h1>
      <p>Escolha uma e comece. Tudo roda no seu navegador.</p>
    </section>
    <section class="stage" tabindex="0" role="group" aria-roledescription="carrossel" aria-label="Ferramentas. Use as setas do teclado para girar.">
      <div class="track"></div>
    </section>
    <nav class="ctrl" aria-label="Escolher ferramenta">
      <button class="nav prev" type="button" aria-label="Ferramenta anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="dots"></div>
      <button class="nav next" type="button" aria-label="Próxima ferramenta"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </nav>
  </main>
  <p id="live" class="sr" aria-live="polite"></p>
</div>
<script src="ferramentas.js"></script>
<script src="hub.js"></script>
</body>
</html>
