:root{
  --bg:#ECEFF6; --blob1:#A3D841; --blob2:#1FBCCF; --blob3:#1069C5;
  --text:#011E3E; --muted:#455872; --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.85);
  --stroke:rgba(1,30,62,.14); --accent:#1069C5; --accent-ink:#fff; --ok:#0A7C54; --err:#C0263D;
  --shadow:0 18px 44px rgba(1,30,62,.12);
}
*{box-sizing:border-box;margin:0}
html{color-scheme:light}
body{min-height:100vh;background:var(--bg);color:var(--text);
  font:14px/1.5 "Host Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  position:relative;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;filter:blur(70px);opacity:.75}
.blobs i{position:absolute;border-radius:50%}
.blobs i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-10vw;background:var(--blob1)}
.blobs i:nth-child(2){width:38vw;height:38vw;right:-8vw;top:20vh;background:var(--blob2)}
.blobs i:nth-child(3){width:34vw;height:34vw;left:30vw;bottom:-16vw;background:var(--blob3)}
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:22px;
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:var(--shadow)}
.app{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:40px 20px 60px}
header{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;margin-bottom:28px}
h1{font-size:28px;font-weight:650;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.tabs{display:flex;padding:5px;gap:4px;border-radius:999px}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:550;padding:9px 20px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
main{display:grid;grid-template-columns:1fr 310px;gap:20px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
.left{display:flex;flex-direction:column;gap:20px}
.drop{padding:42px 24px;text-align:center;border-style:dashed;cursor:pointer;transition:background .2s,transform .2s}
.drop:hover,.drop.over{background:var(--glass-hi)}
.drop.over{transform:scale(1.01)}
.drop b{display:block;font-size:18px;font-weight:600;margin-bottom:4px}
.drop span{color:var(--muted);font-size:14px}
.queue{padding:8px;display:flex;flex-direction:column;gap:4px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:10px 12px;border-radius:16px}
.item:hover{background:var(--glass)}
.thumb{width:52px;height:52px;border-radius:12px;background:var(--glass-hi);border:1px solid var(--stroke);display:grid;place-items:center;font-size:12px;font-weight:650;color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}

/* ---------- interface ---------- */
const fmtSize = b => b>=1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB';
const extOf = n => (n.split('.').pop()||'').toLowerCase();
const baseOf = n => n.replace(/\.[^.]+$/,'');

function renderControls(){
  $('#drop b').textContent = tab==='video' ? 'Solte o vídeo aqui' : 'Solte os arquivos aqui';
  $('#file').multiple = tab!=='video';
  $('#controls').innerHTML = CONTROLS[tab]();
  $('#dropHint').textContent = CFG[tab].hint;
  $('#file').accept = CFG[tab].accept;
}
function renderQueue(){
  const list = items[tab], q = $('#queue'), hasEd = list.length>0 && !!list[0].editor;
  $('#queue').hidden = hasEd || tab==='video'; $('#drop').hidden = hasEd; $('#editor').hidden = !hasEd;
  if(hasEd){ q.innerHTML=''; ED.update(); }
  else if(tab==='video'){ q.innerHTML=''; }
  else if(!list.length){ q.innerHTML = '<p class="empty">Nenhum arquivo ainda.</p>'; }
  else q.innerHTML = list.map(it => {
    let meta = fmtSize(it.file.size);
    if(it.state==='done'){ const d = Math.round((1-it.out.size/it.file.size)*100);
      meta += ` → ${fmtSize(it.out.size)} <span class="gain">${d>0?'−'+d+'%':'+'+Math.abs(d)+'%'}</span>`; }
    if(it.state==='working') meta += ' · processando…';
    if(it.state==='error') meta += ` · <span class="err">${it.msg}</span>`;
    const thumb = it.thumb ? `<img src="${it.thumb}" alt="">` : extOf(it.file.name).slice(0,4).toUpperCase();
    return `<div class="item" data-id="${it.id}">
      <div class="thumb">${thumb}</div>
      <div><div class="name" title="${it.file.name}">${it.file.name}</div>
        <div class="meta">${meta}</div>
        ${it.state==='working'?`<div class="bar"><i id="p${it.id}"></i></div>`:''}</div>
      <div class="acts">
        ${it.state==='done'?`<a class="btn sm primary" href="${it.out.url}" download="${it.out.name}">Baixar</a>`:''}
        <button class="btn sm" data-rm="${it.id}" aria-label="Remover ${it.file.name}" ${busy?'disabled':''}>Remover</button>
      </div></div>`;
  }).join('');
  const n = list.length, done = list.some(i=>i.state==='done');
  $('#run').disabled = busy || !list.some(i=>i.state!=='done');
  $('#all').hidden = n===0; $('#all').innerHTML = IC.dl+'<span>'+(n>1?'Baixar todos':'Baixar')+'</span>'; $('#all').disabled = !done; $('#all').classList.toggle('primary', done);
  $('#clear').hidden = n<2; $('#clear').disabled = busy;
}
const setStatus = t => $('#status').textContent = t;
const setProg = (it,r) => { const el = $('#p'+it.id); if(el) el.style.width = Math.min(100,Math.round(r*100))+'%'; };

function openEditor(f){
  const it = {id:++uid, file:f, state:'ready', thumb:null, editor:true};
  items[tab].push(it); renderQueue(); renderControls(); ED.open(it);
}
function addFiles(files){
  files = [...files];
  const otherEd = (tab==='video' ? items.audio : items.video)[0];
  if(tab==='video' || (tab==='audio' && files.some(f=>f.type.startsWith('video/')))){
    if(items[tab].length){ setStatus('Remova o item atual para carregar outro.'); return; }
    if(otherEd && otherEd.editor){ setStatus('Já há um vídeo aberto na aba '+(tab==='video'?'Áudio':'Vídeo')+'. Remova-o antes.'); return; }
    const vs = files.filter(f => f.type.startsWith('video/'));
    if(!vs.length){ setStatus('Isso não é um arquivo de vídeo.'); return; }
    openEditor(vs[0]);
    setStatus(files.length>1 ? 'Só um vídeo por vez: usei o primeiro e ignorei os outros.' : '');
    return;
  }
  for(const f of files){
    const ok = tab==='image' ? f.type.startsWith('image/') : tab==='audio' ? (f.type.startsWith('audio/')||f.type.startsWith('video/')) : (f.type.startsWith('video/')||f.type==='image/gif');
    if(!ok){ setStatus(`“${f.name}” não é um arquivo de ${({image:'imagem',audio:'áudio',video:'vídeo'})[tab]}.`); continue; }
    items[tab].push({id:++uid, file:f, state:'ready', thumb: tab==='image'?URL.createObjectURL(f):null});
  }
  renderQueue();
}

/* ---------- processamento ---------- */
const tick = () => new Promise(r => setTimeout(r));
const clamp16 = a => { const r = new Int16Array(a.length); for(let i=0;i<a.length;i++){ const x=Math.max(-1,Math.min(1,a[i])); r[i]=x<0?x*32768:x*32767; } return r; };

function encWav(b){
  const n=Math.min(2,b.numberOfChannels), len=b.length, d=new DataView(new ArrayBuffer(44+len*n*2));
  const w=(o,t)=>[...t].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');d.setUint32(4,36+len*n*2,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,n,true);
  d.setUint32(24,b.sampleRate,true);d.setUint32(28,b.sampleRate*n*2,true);d.setUint16(32,n*2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,len*n*2,true);
  const ch=[...Array(n)].map((_,i)=>b.getChannelData(i)); let o=44;
  for(let i=0;i<len;i++) for(let c=0;c<n;c++){ const x=Math.max(-1,Math.min(1,ch[c][i])); d.setInt16(o,x<0?x*32768:x*32767,true); o+=2; }
  return new Blob([d],{type:'audio/wav'});
}

function parseTime(str){
  const t = String(str||'').trim().replace(',','.');
  if(!t) return null;
  const parts = t.split(':');
  if(parts.length>3 || parts.some(p => p==='' || isNaN(Number(p)) || Number(p)<0)) throw new Error('Tempo inválido: use 90 (segundos) ou 1:30.');
  return parts.reduce((acc,p) => acc*60 + Number(p), 0);
}

async function doAudio(it, cfg){
  const o = cfg || opts.audio, t0 = cfg ? cfg.t0 : parseTime(o.start), t1 = cfg ? cfg.t1 : parseTime(o.end), ctx = new (window.AudioContext||window.webkitAudioContext)();
  let buf;
  try{ buf = await ctx.decodeAudioData(await it.file.arrayBuffer()); }
  catch(e){ ctx.close(); throw new Error('Não foi possível ler o áudio deste arquivo.'); }
  if(t0!==null || t1!==null || o.fi || o.fo || (o.vol!==undefined && o.vol!==1)){
    const sr=buf.sampleRate, s0=Math.floor((t0||0)*sr), e0=t1===null ? buf.length : Math.min(buf.length, Math.floor(t1*sr));
    if(e0<=s0){ ctx.close(); throw new Error('O fim precisa ser maior que o início (o arquivo tem '+(buf.length/sr).toFixed(1)+' s).'); }
    const nb = ctx.createBuffer(buf.numberOfChannels, e0-s0, sr);
    const gain = o.vol===undefined ? 1 : o.vol;
    for(let c=0;c<buf.numberOfChannels;c++){ const src=buf.getChannelData(c), d=nb.getChannelData(c); const n=e0-s0, fi=(o.fi||0)*sr, fo=(o.fo||0)*sr; for(let i=0;i<n;i++){ let f=1; if(fi && i<fi) f=i/fi; if(fo && n-i<fo) f=Math.min(f,(n-i)/fo); d[i]=src[s0+i]*gain*f; } }
    buf = nb;
  }
  setProg(it,.1);
  if(o.fmt==='wav'){ ctx.close(); return {blob:encWav(buf), ext:'wav'}; }
  if(o.fmt==='mp3'){
    ctx.close();
    if(typeof lamejs==='undefined') throw new Error('Codificador MP3 não carregou. Verifique a internet e recarregue.');
    const n=Math.min(2,buf.numberOfChannels), enc=new lamejs.Mp3Encoder(n,buf.sampleRate,o.br);
    const L=clamp16(buf.getChannelData(0)), R=n>1?clamp16(buf.getChannelData(1)):null, out=[];
    for(let i=0,k=0;i<L.length;i+=1152,k++){
      const x = n>1 ? enc.encodeBuffer(L.subarray(i,i+1152),R.subarray(i,i+1152)) : enc.encodeBuffer(L.subarray(i,i+1152));
      if(x.length) out.push(new Uint8Array(x));
      if(k%200===0){ setProg(it,.1+.9*i/L.length); await tick(); }
    }
    const f=enc.flush(); if(f.length) out.push(new Uint8Array(f));
    return {blob:new Blob(out,{type:'audio/mpeg'}), ext:'mp3'};
  }
  // Opus (WebM): gravado em tempo real
  await ctx.resume();
  const mime='audio/webm;codecs=opus';
  if(!MediaRecorder.isTypeSupported(mime)) throw new Error('Este navegador não grava Opus.');
  const dest=ctx.createMediaStreamDestination(), src=ctx.createBufferSource(); src.buffer=buf; src.connect(dest);
  const rec=new MediaRecorder(dest.stream,{mimeType:mime,audioBitsPerSecond:o.br*1000}), parts=[];
  rec.ondataavailable=e=>{ if(e.data.size) parts.push(e.data); };
  const tPlay=ctx.currentTime, iv=setInterval(()=>setProg(it,(ctx.currentTime-tPlay)/buf.duration),300);
  await new Promise(res=>{ rec.onstop=res; src.onended=()=>rec.stop(); rec.start(); src.start(); });
  clearInterval(iv); ctx.close();
  return {blob:new Blob(parts,{type:'audio/webm'}), ext:'webm'};
}

let gifWorker = null;
async function getGifWorker(){
  if(gifWorker) return gifWorker;
  const r = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
  gifWorker = URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}));
  return gifWorker;
}

const NEUTRAL = {fi:0,fo:0,bri:100,con:100,sat:100,bw:false,txt:'',tsz:6,tpos:'b',spd:1};
const advOf = it => (it.adv && it.edit) ? it.edit.a : NEUTRAL;
const cssFilter = a => (a.bri===100 && a.con===100 && a.sat===100 && !a.bw) ? 'none' : `brightness(${a.bri/100}) contrast(${a.con/100}) saturate(${a.sat/100})${a.bw?' grayscale(1)':''}`;
function overlay(g,w,h,a,f){
  if(a.txt){
    const fs=a.tsz/100*h;
    g.font=`700 ${fs}px "Host Grotesk",-apple-system,"Segoe UI",Roboto,Arial,sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#fff';
    g.shadowColor='rgba(0,0,0,.7)'; g.shadowBlur=fs*.15; g.shadowOffsetY=fs*.05;
    const y = a.tpos==='t' ? h*.08+fs*.6 : a.tpos==='m' ? h/2 : h-h*.08-fs*.6;
    g.fillText(a.txt,w/2,y,w*.94);
    g.shadowColor='transparent'; g.shadowBlur=0; g.shadowOffsetY=0;
  }
  if(f<1){ g.fillStyle=`rgba(0,0,0,${1-f})`; g.fillRect(0,0,w,h); }
}
function edCfg(it,o){
  const tr = it.trim || {s:0,e:it.dur||0};
  return {fmt:o.fmt, br:o.br, t0: tr.s>0.05 ? tr.s : null, t1: (it.dur && tr.e<it.dur-0.05) ? tr.e : null, vol: it.edit ? it.edit.vol : 1, fi: advOf(it).fi, fo: advOf(it).fo};
}
function frameGeom(v,e){
  const sw = e.rot%180!==0, pw = sw ? v.videoHeight : v.videoWidth, ph = sw ? v.videoWidth : v.videoHeight, c = e.crop || {x:0,y:0,w:1,h:1};
  return {pw, ph, cx:c.x*pw, cy:c.y*ph, cw:c.w*pw, ch:c.h*ph};
}
function paint(g,v,e,geo,k){
  g.setTransform(k,0,0,k,-geo.cx*k,-geo.cy*k);
  g.translate(geo.pw/2,geo.ph/2); g.scale(e.flip?-1:1,1); g.rotate(e.rot*Math.PI/180);
  g.filter = e.flt || 'none';
  g.drawImage(v,-v.videoWidth/2,-v.videoHeight/2);
  g.filter = 'none';
  g.setTransform(1,0,0,1,0,0);
}

async function doVideo(it){
  const o = opts.video, gifOut = o.fmt==='gif';
  if(o.fmt==='mp3') return doAudio(it, edCfg(it,{fmt:'mp3',br:o.br}));
  const ed = it.edit || {rot:0,flip:false,vol:1,crop:null};
  const A = advOf(it), edf = {...ed, flt:cssFilter(A)};
  if(gifOut && typeof GIF==='undefined') throw new Error('Codificador de GIF não carregou. Verifique a internet e recarregue.');
  if(!gifOut && typeof MediaRecorder==='undefined') throw new Error('Este navegador não grava vídeo. Use o Chrome ou o Edge.');
  const url = URL.createObjectURL(it.file), v = document.createElement('video');
  v.src = url; v.playsInline = true; v.preload = 'auto';
  try{
    await new Promise((res,rej)=>{ v.onloadedmetadata=res; v.onerror=()=>{ const c=v.error&&v.error.code; rej(new Error(c===4 ? 'Formato ou codec não suportado pelo navegador (comum em vídeos HEVC/H.265 de iPhone ou gravação de tela). Tente no computador com Chrome ou Edge, ou converta antes para H.264.' : c===3 ? 'O vídeo está corrompido ou usa um codec que o navegador não decodifica.' : 'O navegador não consegue ler este vídeo (código '+(c||'?')+').')); }; });
    const geo = frameGeom(v,ed);
    let w=Math.round(geo.cw), h=Math.round(geo.ch), k=1;
    const maxH = o.h || (gifOut ? 480 : 0);
    if(maxH && h>maxH){ k=maxH/h; w=Math.round(w*k); h=maxH; }
    w += w%2; h += h%2;
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const g=c.getContext('2d'), dur=v.duration;
    if(!isFinite(dur)) throw new Error('Não foi possível descobrir a duração do vídeo.');
    const ts = Math.max(0, it.trim ? it.trim.s : 0), te = Math.min(dur, it.trim ? it.trim.e : dur);
    const fade = t => { let f=1; if(A.fi>0) f=Math.min(f,(t-ts)/A.spd/A.fi); if(A.fo>0) f=Math.min(f,(te-t)/A.spd/A.fo); return Math.max(0,Math.min(1,f)); };
    const drawOut = t => { paint(g,v,edf,geo,k); overlay(g,w,h,A,fade(t)); };

    if(gifOut){
      const fps=o.fps||12, total=Math.max(1,Math.floor((te-ts)/A.spd*fps));
      if(total>600) throw new Error('Vídeo longo demais para GIF (máx. 600 quadros). Reduza o fps ou use um trecho menor.');
      const gif=new GIF({workers:2,quality:Math.max(1,Math.round(30-o.q*0.27)),width:w,height:h,workerScript:await getGifWorker()});
      for(let i=0;i<total;i++){
        const t=Math.min(ts+i*A.spd/fps,Math.max(0,te-0.05));
        if(Math.abs(v.currentTime-t)>0.001){ const sk=new Promise(r=>v.onseeked=r); v.currentTime=t; await sk; }
        drawOut(t); gif.addFrame(g,{copy:true,delay:Math.round(1000/fps)});
        setProg(it,.5*i/total);
      }
      const blob = await new Promise(r=>{ gif.on('progress',p=>setProg(it,.5+.5*p)); gif.on('finished',r); gif.render(); });
      return {blob, ext:'gif'};
    }

    const list = o.fmt==='webm' ? ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
                                : ['video/mp4;codecs=avc1,mp4a.40.2','video/mp4'];
    const mime = list.find(m=>MediaRecorder.isTypeSupported(m));
    if(!mime) throw new Error(`Este navegador não grava ${o.fmt.toUpperCase()}. Tente WebM.`);
    const fps=o.fps||30, ac=new (window.AudioContext||window.webkitAudioContext)();
    await ac.resume();
    if(ts>0.01){ const sk=new Promise(r=>v.onseeked=r); v.currentTime=ts; await sk; }
    const dest=ac.createMediaStreamDestination();
    const gn=ac.createGain(); gn.gain.value=ed.vol*(A.fi>0?0:1); ac.createMediaElementSource(v).connect(gn); gn.connect(dest);   // sem conectar à saída: não toca som
    const stream=c.captureStream();

    const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.round(w*h*fps*(.03+o.q/100*.17)),audioBitsPerSecond:128000});
    const parts=[]; rec.ondataavailable=e=>{ if(e.data.size) parts.push(e.data); };
    let stop=false, iv=null, last=0, fin=()=>{};

      if(now-last >= 1000/fps-5){ last=now; drawOut(v.currentTime); gn.gain.setTargetAtTime(ed.vol*fade(v.currentTime),ac.currentTime,.02); setProg(it,(v.currentTime-ts)/Math.max(.1,te-ts)); }

      rec.onstop=res; fin=()=>{ if(rec.state!=='inactive') rec.stop(); v.pause(); }; v.onended=fin; v.ontimeupdate=()=>{ if(v.currentTime>=te-0.02) fin(); }; v.onerror=()=>rej(new Error('Erro ao reproduzir o vídeo.'));

      v.playbackRate=A.spd; v.play().catch(()=>{ rec.stop(); rej(new Error('O navegador bloqueou a reprodução. Clique em Converter de novo.')); });

    return {blob:new Blob(parts,{type: mime.split(';')[0]}), ext};
  } finally { URL.revokeObjectURL(url); }
}

async function doImage(it){
  const o = opts.image, f = it.file;
  let type = {keep:null, webp:'image/webp', jpeg:'image/jpeg', png:'image/png'}[o.fmt];
  if(!type) type = ['image/jpeg','image/png','image/webp'].includes(f.type) ? f.type : 'image/webp';
  const bmp = await createImageBitmap(f);
  let w = bmp.width, h = bmp.height;
  if(o.w && w>o.w){ h = Math.round(h*o.w/w); w = o.w; }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  if(type==='image/jpeg'){ g.fillStyle='#fff'; g.fillRect(0,0,w,h); }
  g.drawImage(bmp,0,0,w,h);
  const blob = await new Promise(r => c.toBlob(r, type, o.q/100));
  if(!blob || blob.type!==type) throw new Error('Este navegador não gera este formato.');

  return {blob, ext};
}

async function runAll(){
  busy = true;
  const kind = tab;
  for(const it of items[kind]){
    if(it.state==='done') continue;
    it.state = 'working'; renderQueue();
    setStatus('Processando…');
    try{
      const r = kind==='image' ? await doImage(it) : kind==='audio' ? await doAudio(it, it.editor ? edCfg(it,opts.audio) : undefined) : await doVideo(it);
      if(it.out) URL.revokeObjectURL(it.out.url);
      const same = extOf(it.file.name)===r.ext;
      it.out = {blob:r.blob, size:r.blob.size, url:URL.createObjectURL(r.blob),
        name: baseOf(it.file.name)+((it.trim&&(it.trim.s>0.05||it.trim.e<it.dur-0.05))?'-trecho':(same?'-comprimido':''))+'.'+r.ext};
      it.state = 'done';
    }catch(e){
      it.state = 'error'; it.msg = (e && e.message) ? e.message : 'Falha na conversão.'; console.error(e);
    }
    renderQueue();
  }
  busy = false; renderQueue();
  setStatus(items[kind].length>1 ? 'Pronto. Use “Baixar” em cada arquivo ou “Baixar todos”.' : 'Pronto. Use “Baixar”.');
}

const ico = (p, f, z=18) => `<svg viewBox="0 0 24 24" width="${z}" height="${z}" ${f?'fill="currentColor"':'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'} aria-hidden="true">${p}</svg>`;

      const kk=e.ar ? g.pw/(g.ph*e.ar) : 0;
      let w=Math.abs(p.x-ox), h=Math.abs(p.y-oy);
      if(e.ar){ w=Math.max(w,h/kk); h=w*kk; if(w>mxW){ w=mxW; h=w*kk; } if(h>mxH){ h=mxH; w=h/kk; } }
      else { w=Math.min(w,mxW); h=Math.min(h,mxH); }
      w=Math.max(mn,w); h=e.ar ? w*kk : Math.max(mn,h);
      e.crop={x:dx>0?ox:ox-w, y:dy>0?oy:oy-h, w, h};
    }
    this.syncCrop(); this.touch();
  },
  syncCrop(){
    const el=$('#edCrop'), c=this.it&&this.it.edit.crop; if(!el) return;
    this.syncText(); el.hidden=!c; if(c) el.style.cssText=`left:${c.x*100}%;top:${c.y*100}%;width:${c.w*100}%;height:${c.h*100}%`;
  },
  touch(){ const it=this.it; this.syncTools(); if(it && it.state!=='ready'){ it.state='ready'; renderQueue(); } },
  toggle(){
    const v=this.v, {s,e}=this.it.trim;
    if(v.paused){ if(v.currentTime<s-0.05 || v.currentTime>=e-0.05) v.currentTime=s; v.play(); } else v.pause();
  },
  loop(){
    cancelAnimationFrame(this.raf);
    const step=()=>{
      const v=this.v; if(!v||!this.it) return;
      this.playhead();
      if(!v.paused){
        if(v.currentTime>=this.it.trim.e){ v.pause(); v.currentTime=this.it.trim.e; }
        else this.raf=requestAnimationFrame(step);
      }
    };
    this.raf=requestAnimationFrame(step);
  },
  setTrim(k,t){
    const it=this.it, tr=it.trim, mn=.1;
    if(k==='s') tr.s=Math.min(Math.max(0,t),tr.e-mn); else tr.e=Math.max(Math.min(it.dur,t),tr.s+mn);
    this.v.currentTime=tr[k]; this.sync(); this.playhead(); this.touch();
  },
  playhead(){ if(this.v&&this.it) $('#edPh').style.left=(this.v.currentTime/this.it.dur*100)+'%'; },
  sync(){
    const it=this.it, {s,e}=it.trim, d=it.dur, ps=s/d*100, pe=e/d*100;
    $('#edSel').style.cssText=`left:${ps}%;width:${pe-ps}%`;
    $('#edShL').style.width=ps+'%'; $('#edShR').style.width=(100-pe)+'%';
    for(const [k,p,t] of [['s',ps,s],['e',pe,e]]){
      const h=$('#edH_'+k); h.style.left=`calc(${p}% - 8px)`;
      h.setAttribute('aria-valuemin',0); h.setAttribute('aria-valuemax',d.toFixed(1)); h.setAttribute('aria-valuenow',t.toFixed(1));
      const inp=$('#edT_'+k); if(document.activeElement!==inp) inp.value=this.fmt(t);
    }
    $('#edLen').textContent='Trecho de '+(e-s).toFixed(1).replace('.',',')+' s';
  },
  async thumbs(){
    const it=this.it, strip=$('#edStrip'), tv=document.createElement('video');
    tv.muted=true; tv.preload='auto'; tv.src=it.url;
    await new Promise(r=>{ tv.onloadeddata=r; tv.onerror=r; setTimeout(r,4000); });
    const N=14, cw=120, ch=68, vw=tv.videoWidth, vh=tv.videoHeight; if(!vw) return;
    for(let i=0;i<N;i++){
      if(this.it!==it) return;
      await new Promise(r=>{ tv.onseeked=r; tv.currentTime=(i+.5)/N*it.dur; setTimeout(r,2500); });
      const c=document.createElement('canvas'); c.width=cw; c.height=ch;
      const k=Math.max(cw/vw,ch/vh); c.getContext('2d').drawImage(tv,(cw-vw*k)/2,(ch-vh*k)/2,vw*k,vh*k);
      const im=new Image(); im.alt=''; im.src=c.toDataURL('image/jpeg',.6); strip.appendChild(im);
    }
  },
  frame(type){
    const v=this.v, e=this.it.edit, geo=frameGeom(v,e), c=document.createElement('canvas');
    c.width=Math.round(geo.cw); c.height=Math.round(geo.ch);
    const g=c.getContext('2d'); if(type==='image/jpeg'){ g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); }
    const A=advOf(this.it); paint(g,v,{...e,flt:cssFilter(A)},geo,1); overlay(g,c.width,c.height,A,1);
    const name=baseOf(this.it.file.name)+'-'+this.fmt(v.currentTime).replace(':','m').replace('.','s')+(type==='image/png'?'.png':'.jpg');
    c.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }, type, .95);
  },
  update(){
    const it=this.it, r=$('#edRes'); if(!it || !r) return;
    $('#edLock').inert = busy; $('#edSwap').disabled=busy; $('#edRm').disabled=busy;
    const mp3 = opts.video.fmt==='mp3', fx=$('#edFx'); if(fx) fx.hidden = mp3;
    const pc=$('#pCrop'); if(pc && mp3){ pc.hidden=true; $('#tCrop').setAttribute('aria-expanded','false'); }
    $('#edPlay').disabled = busy;
    const adv=!!it.adv; $('#edAdvG').hidden=!adv; $('#edAdvA').hidden=!adv; const av=$('#edAdvV'); if(av) av.hidden=!adv||mp3;
    if(!adv) this.closeAdv(); else if(mp3) ['pFilt','pTxt','pSpd'].forEach(id=>{ const p=$('#'+id); if(p) p.hidden=true; });
    this.syncAdv();
    const audioOnly = it.tab==='audio' || opts.video.fmt==='mp3';
    if(it.state==='working') r.innerHTML=`<div class="work run"><img class="mascot" src="${ASSET.run}" alt="" width="96" height="90"><div class="grow"><div class="meta">${it.tab==='audio'?'Convertendo áudio…':audioOnly?'Extraindo áudio…':'Gravando em tempo real…'}</div><div class="bar"><i id="p${it.id}"></i></div></div></div>`;
    else if(it.state==='done'){
      const d=Math.round((1-it.out.size/it.file.size)*100);
      r.innerHTML=`<div class="work"><img class="mascot" src="${ASSET.done}" alt="" width="96" height="90"><div class="grow"><div class="name">Pronto!</div><div class="meta">${fmtSize(it.file.size)} → ${fmtSize(it.out.size)} <span class="gain">${d>0?'−'+d+'%':'+'+Math.abs(d)+'%'}</span> · use o botão Baixar.</div></div></div>`;
    }
    else if(it.state==='error') r.innerHTML=`<div class="meta err">${it.msg}</div>`;
    else r.innerHTML='';
  }
};

/* ---------- eventos ---------- */
document.querySelectorAll('#app .tab').forEach(b => b.onclick = () => {
  if(busy) return;
  ED.pause();
  tab = b.dataset.tab;
  document.querySelectorAll('#app .tab').forEach(x => x.setAttribute('aria-selected', x===b));
  setStatus(''); renderControls(); renderQueue();
  if(ED.it && ED.it.tab===tab) ED.layout();
});
$('#controls').addEventListener('input', e => {
  const k = e.target.dataset.k; if(!k) return;
  const v = e.target.value;
  opts[tab][k] = (k==='fmt'||k==='start'||k==='end') ? v : Number(v);
  if(k==='q') $('#qv').textContent = v+'%';
  if(tab==='video' && k==='fmt') renderControls();
  // mudar ajustes reabre os arquivos já convertidos
  items[tab].forEach(i => { if(i.state==='done') i.state='ready'; });
  renderQueue();
});
const drop = $('#drop'), fileIn = $('#file');
drop.onclick = () => fileIn.click();
drop.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fileIn.click(); } };
fileIn.onchange = () => { addFiles(fileIn.files); fileIn.value=''; };
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
$('#queue').addEventListener('click', e => {
  const id = e.target.dataset.rm; if(!id) return;
  items[tab] = items[tab].filter(i => i.id!=id); renderQueue();
});
$('#run').onclick = runAll;
$('#clear').onclick = () => { items[tab] = []; if(ED.it && ED.it.tab===tab) ED.close(); setStatus(''); renderQueue(); };
$('#all').onclick = async () => {
  for(const it of items[tab].filter(i=>i.state==='done')){
    const a = document.createElement('a'); a.href = it.out.url; a.download = it.out.name; a.click();
    await new Promise(r => setTimeout(r, 350));
  }
};

renderControls(); renderQueue();

/* ---------- home ---------- */
const KIND = {video:'Vídeo', audio:'Áudio', image:'Imagem'};
const HOME_TXT = {video:'Solte o vídeo aqui', audio:'Solte os áudios aqui', image:'Solte as imagens aqui'};
const kindOf = f => f.type.startsWith('video/') ? 'video' : f.type.startsWith('audio/') ? 'audio' : f.type.startsWith('image/') ? 'image' : null;
let homeTab = 'video';
function setHomeTab(t){
  homeTab = t;
  document.querySelectorAll('#homeTabs .tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab===t));
  $('#homeDrop b').textContent = HOME_TXT[t] + ' ou clique para escolher';
  $('#homeHint').textContent = CFG[t].hint;
  $('#homeFile').accept = t==='audio' ? 'audio/*' : CFG[t].accept; $('#homeFile').multiple = t!=='video';
  $('#homeMsg').textContent = '';
}
function enterApp(t){
  tab = t; ED.pause();
  document.querySelectorAll('#app .tab').forEach(x => x.setAttribute('aria-selected', x.dataset.tab===t));
  $('#home').hidden = true; $('#app').hidden = false; document.body.classList.remove('on-home');
  setStatus(''); renderControls(); renderQueue();
  if(ED.it && ED.it.tab===tab) ED.layout();
}
function homeFiles(files){
  files = [...files];
  const ks = files.map(kindOf).filter(Boolean);
  if(!ks.length){ $('#homeMsg').textContent = 'Formato não reconhecido. Use um arquivo de vídeo, áudio ou imagem.'; return; }
  const t = ks.includes(homeTab) ? homeTab : ks[0], use = files.filter(f => kindOf(f)===t);
  enterApp(t); addFiles(use);
  const notes = [];
  if(t!==homeTab) notes.push('Abri a aba '+KIND[t]+' pelo tipo do arquivo.');
  if(use.length<files.length) notes.push('Arquivos de outros tipos foram ignorados.');
  if(notes.length) setStatus(notes.join(' '));
}
function goHome(){
  if(busy) return;
  const has = Object.values(items).some(a => a.length);
  if(has && !confirm('Voltar ao início? Os arquivos carregados serão descartados.')) return;
  if(ED.it) ED.close();
  for(const k in items) items[k] = [];
  $('#app').hidden = true; $('#home').hidden = false; document.body.classList.add('on-home'); setHomeTab(homeTab);
}
document.querySelectorAll('#homeTabs .tab').forEach(b => b.onclick = () => setHomeTab(b.dataset.tab));
const hd = $('#homeDrop'), hf = $('#homeFile');
hd.onclick = () => hf.click();
hd.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hf.click(); } };
hf.onchange = () => { homeFiles(hf.files); hf.value=''; };
['dragenter','dragover'].forEach(ev => hd.addEventListener(ev, e => { e.preventDefault(); hd.classList.add('over'); }));
['dragleave','drop'].forEach(ev => hd.addEventListener(ev, e => { e.preventDefault(); hd.classList.remove('over'); }));
hd.addEventListener('drop', e => homeFiles(e.dataTransfer.files));
$('#logoBtn').onclick = goHome;
setHomeTab('video');
$('#run').innerHTML = IC.conv+'<span>Converter</span>'; $('#clear').innerHTML = IC.trash+'<span>Limpar lista</span>';
</script>
